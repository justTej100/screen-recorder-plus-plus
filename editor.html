<!doctype html><meta charset="utf-8"><title>Editor · Screen Recorder Plus Plus</title>
<link rel="icon" type="image/png" href="icons/icon-32.png?v=3">
<link rel="stylesheet" href="style.css">
<main>
  <div class="tools"><img class="logo" src="icons/icon-128.png" alt="Screen Recorder ++"><button id="close">← Close editor</button></div>
  <h1 id="title">Editor</h1>
  <p id="nf" class="muted" hidden>Recording not found. It may have been deleted.</p>
  <section id="editor" hidden>
    <video id="v"></video>
    <div id="tl"></div>
    <p class="muted">Gray = kept · red = your voice muted · white = voiceover recorded</p>
    <div class="player">
      <button id="play" class="b-purple" aria-label="Play"></button><span id="clock" class="muted"></span><span class="sp"></span>
      <button id="vol" class="b-blue" aria-label="Mute or unmute"></button><input type="range" id="volume" min="0" max="1" step="0.05" value="1" aria-label="Volume">
    </div>
    <div class="tools">
      <button id="setIn" class="b-blue">Set start here</button><button id="setOut" class="b-blue">Set end here</button><button id="reset">Reset trim</button>
      <span id="trimInfo" class="muted"></span>
    </div>
    <div class="tools"><button id="muteBtn" class="b-orange">Mute my voice from here</button></div>
    <div id="mutes"></div>
    <div id="recbar" class="row" hidden><span>Recording voiceover. Use headphones.</span><button id="stopvo" class="b-pink">Stop</button></div>
    <p><button id="export" class="primary">Export edited MP4</button> <button id="dl" class="b-green" hidden>Download edited MP4</button> <button id="micdl" class="b-purple" hidden>Download mic audio</button> <span id="prog" class="muted"></span></p>
    <p class="muted">Export plays the video in real time, so keep this tab open and visible until it finishes. The edited video is also saved to your library.</p>
    <video id="xv" hidden></video>
  </section>
</main>
<script type="module" src="editor.js"></script>
